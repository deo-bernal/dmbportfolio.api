name: Keep Portfolio API warm

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake all DMB Render APIs
        run: |
          for url in \
            "https://dmbportfolio-api.onrender.com/health" \
            "https://dmb-crm-api.onrender.com/health" \
            "https://dmb-lms-api.onrender.com/health" \
            "https://dmb-commerce-api.onrender.com/health" \
            "https://dmb-agent-api.onrender.com/health"
          do
            curl -fsS -o /dev/null -w "%{url_effective} %{time_total}s code=%{http_code}\n" \
              "$url" --max-time 90 || true
          done
